<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d"><title id="t">Noise XXhfs handshake, animated</title><desc id="d">Message A carries e and the ML-KEM-768 key e1 (1,216 B). Message B carries e, ee, the KEM ciphertext ekem1, s and es (1,200 B). Message C carries s and se (64 B). Each DH result and the KEM shared secret are mixed into the chaining key, which splits into one key per direction.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.num{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}.draw{stroke-dasharray:1;stroke-dashoffset:0}#k1{animation:k1 12s linear infinite}@keyframes k1{0%,3.33%{stroke-dashoffset:1;opacity:0}3.34%{opacity:1}11.67%,96%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k2{animation:k2 12s linear infinite}@keyframes k2{0%,11.67%{opacity:0;transform:translateY(4px)}13.67%,96%{opacity:1;transform:none}100%{opacity:0}}#k3{animation:k3 12s linear infinite}@keyframes k3{0%,11.67%{opacity:0;transform:translateY(4px)}13.67%,96%{opacity:1;transform:none}100%{opacity:0}}#k4{animation:k4 12s linear infinite}@keyframes k4{0%,19.17%{stroke-dashoffset:1;opacity:0}19.180000000000003%{opacity:1}27.5%,96%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k5{animation:k5 12s linear infinite}@keyframes k5{0%,27.5%{opacity:0;transform:translateY(4px)}29.5%,96%{opacity:1;transform:none}100%{opacity:0}}#k6{animation:k6 12s linear infinite}@keyframes k6{0%,27.5%{opacity:0;transform:translateY(4px)}29.5%,96%{opacity:1;transform:none}100%{opacity:0}}#k7{animation:k7 12s linear infinite}@keyframes k7{0%,42.5%{stroke-dashoffset:1;opacity:0}42.51%{opacity:1}50.83%,96%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k8{animation:k8 12s linear infinite}@keyframes k8{0%,50.83%{opacity:0;transform:translateY(4px)}52.83%,96%{opacity:1;transform:none}100%{opacity:0}}#k9{animation:k9 12s linear infinite}@keyframes k9{0%,50.83%{opacity:0;transform:translateY(4px)}52.83%,96%{opacity:1;transform:none}100%{opacity:0}}#k10{animation:k10 12s linear infinite}@keyframes k10{0%,29.17%{opacity:0;transform:translateY(4px)}31.17%,96%{opacity:1;transform:none}100%{opacity:0}}#k11{animation:k11 12s linear infinite}@keyframes k11{0%,31.67%{opacity:0;transform:translateY(4px)}33.67%,96%{opacity:1;transform:none}100%{opacity:0}}#k12{animation:k12 12s linear infinite}@keyframes k12{0%,34.17%{opacity:0;transform:translateY(4px)}36.17%,96%{opacity:1;transform:none}100%{opacity:0}}#k13{animation:k13 12s linear infinite}@keyframes k13{0%,52.5%{opacity:0;transform:translateY(4px)}54.5%,96%{opacity:1;transform:none}100%{opacity:0}}#k14{animation:k14 12s linear infinite}@keyframes k14{0%,58.33%{opacity:0;transform:translateY(4px)}60.33%,96%{opacity:1;transform:none}100%{opacity:0}}#k15{animation:k15 12s linear infinite}@keyframes k15{0%,62.5%{stroke-dashoffset:1;opacity:0}62.51%{opacity:1}69.17%,96%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k16{animation:k16 12s linear infinite}@keyframes k16{0%,69.17%{opacity:0;transform:translateY(4px)}71.17%,96%{opacity:1;transform:none}100%{opacity:0}}#k17{animation:k17 12s linear infinite}@keyframes k17{0%,69.17%{opacity:0;transform:translateY(4px)}71.17%,96%{opacity:1;transform:none}100%{opacity:0}}#k18{animation:k18 12s linear infinite}@keyframes k18{0%,62.5%{stroke-dashoffset:1;opacity:0}62.51%{opacity:1}69.17%,96%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}#k19{animation:k19 12s linear infinite}@keyframes k19{0%,69.17%{opacity:0;transform:translateY(4px)}71.17%,96%{opacity:1;transform:none}100%{opacity:0}}#k20{animation:k20 12s linear infinite}@keyframes k20{0%,69.17%{opacity:0;transform:translateY(4px)}71.17%,96%{opacity:1;transform:none}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="470" rx="16" fill="#fbfaf6"/><text x="32.0" y="40" font-size="18" font-weight="700" fill="#1f2933">Noise XXhfs: one handshake, two independent secrets</text><text x="32.0" y="61" font-size="12.5" fill="#6b7280">Noise_XXhfs_25519+MLKEM768_ChaChaPoly_SHA256, empty payloads. The three XX messages stay; the KEM rides inside them.</text><line x1="96" y1="96" x2="96" y2="400" stroke="#e5e1d8" stroke-width="2"/><text x="96.0" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2933">initiator</text><line x1="580" y1="96" x2="580" y2="400" stroke="#e5e1d8" stroke-width="2"/><text x="580.0" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2933">responder</text><path id="k1" class="draw" pathLength="1" d="M96 130 L572 130" stroke="#1f2933" stroke-width="2" fill="none"/><path id="k2" d="M580 130 l-10 -5 v10 z" fill="#1f2933"/><g id="k3"><rect x="110.0" y="104" width="26.0" height="20" rx="4" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.6"/><text x="123.0" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">e</text><text x="123.0" y="144" text-anchor="middle" font-size="9.5" class="num" fill="#6b7280">32</text><rect x="140.0" y="104" width="331.5" height="20" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="305.8" y="118" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">e1 · 1,184 B</text><text x="594" y="134" font-size="12.5" font-weight="700" fill="#1f2933">A <tspan class="num" font-weight="400" fill="#6b7280">1,216 B</tspan></text></g><path id="k4" class="draw" pathLength="1" d="M580 222 L104 222" stroke="#1f2933" stroke-width="2" fill="none"/><path id="k5" d="M96 222 l10 -5 v10 z" fill="#1f2933"/><g id="k6"><rect x="118.9" y="196" width="26.0" height="20" rx="4" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.6"/><text x="131.9" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">e</text><text x="131.9" y="236" text-anchor="middle" font-size="9.5" class="num" fill="#6b7280">32</text><circle cx="159.88" cy="206" r="9" fill="#fff" stroke="#2f6f9f" stroke-width="1.6"/><text x="159.88" y="209.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f6f9f">ee</text><rect x="172.9" y="196" width="309.1" height="20" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="327.4" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">ekem1 · 1,104 B</text><rect x="486.0" y="196" width="26.0" height="20" rx="4" fill="#fff" stroke="#2f6f9f" stroke-width="1.6"/><text x="499.0" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#2f6f9f">s</text><text x="499.0" y="236" text-anchor="middle" font-size="9.5" class="num" fill="#6b7280">48</text><circle cx="527.0" cy="206" r="9" fill="#fff" stroke="#2f6f9f" stroke-width="1.6"/><text x="527.0" y="209.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f6f9f">es</text><rect x="540.0" y="196" width="26.0" height="20" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.6"/><text x="553.0" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">tag</text><text x="553.0" y="236" text-anchor="middle" font-size="9.5" class="num" fill="#6b7280">16</text><text x="594" y="226" font-size="12.5" font-weight="700" fill="#1f2933">B <tspan class="num" font-weight="400" fill="#6b7280">1,200 B</tspan></text></g><path id="k7" class="draw" pathLength="1" d="M96 314 L572 314" stroke="#1f2933" stroke-width="2" fill="none"/><path id="k8" d="M580 314 l-10 -5 v10 z" fill="#1f2933"/><g id="k9"><rect x="110.0" y="288" width="26.0" height="20" rx="4" fill="#fff" stroke="#2f6f9f" stroke-width="1.6"/><text x="123.0" y="302" text-anchor="middle" font-size="11" font-weight="600" fill="#2f6f9f">s</text><text x="123.0" y="328" text-anchor="middle" font-size="9.5" class="num" fill="#6b7280">48</text><circle cx="151" cy="298" r="9" fill="#fff" stroke="#2f6f9f" stroke-width="1.6"/><text x="151" y="301.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f6f9f">se</text><rect x="164.0" y="288" width="26.0" height="20" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.6"/><text x="177.0" y="302" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">tag</text><text x="177.0" y="328" text-anchor="middle" font-size="9.5" class="num" fill="#6b7280">16</text><text x="594" y="318" font-size="12.5" font-weight="700" fill="#1f2933">C <tspan class="num" font-weight="400" fill="#6b7280">64 B</tspan></text></g><rect x="674" y="84" width="262" height="240" rx="12" fill="#fff" stroke="#e5e1d8"/><text x="690.0" y="108" font-size="12.5" font-weight="700" fill="#1f2933">chaining key ck</text><g id="k10"><rect x="690" y="125" width="6" height="22" rx="2" fill="#2f6f9f"/><text x="704" y="140" font-size="12" fill="#1f2933" class="num">MixKey( X25519 ee )</text></g><g id="k11"><rect x="690" y="159" width="6" height="22" rx="2" fill="#7c3aed"/><text x="704" y="174" font-size="12" fill="#1f2933" class="num">MixKey( ML-KEM-768 shared secret )</text></g><g id="k12"><rect x="690" y="193" width="6" height="22" rx="2" fill="#2f6f9f"/><text x="704" y="208" font-size="12" fill="#1f2933" class="num">MixKey( X25519 es )</text></g><g id="k13"><rect x="690" y="227" width="6" height="22" rx="2" fill="#2f6f9f"/><text x="704" y="242" font-size="12" fill="#1f2933" class="num">MixKey( X25519 se )</text></g><g id="k14"><text x="690" y="278" font-size="12" font-weight="700" fill="#1f2933">Split() → c1, c2</text></g><path id="k15" class="draw" pathLength="1" d="M96 372 L572 372" stroke="#0f766e" stroke-width="2.4" fill="none"/><path id="k16" d="M580 372 l-10 -5 v10 z" fill="#0f766e"/><text id="k17" x="338.0" y="366" text-anchor="middle" font-size="11" fill="#0f766e">transport frame, key c1</text><path id="k18" class="draw" pathLength="1" d="M580 396 L104 396" stroke="#0f766e" stroke-width="2.4" fill="none"/><path id="k19" d="M96 396 l10 -5 v10 z" fill="#0f766e"/><text id="k20" x="338.0" y="390" text-anchor="middle" font-size="11" fill="#0f766e">transport frame, key c2</text><rect x="690" y="342" width="14" height="12" rx="3" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.6"/><text x="710.0" y="352" font-size="11.5" fill="#1f2933">X25519</text><rect x="768" y="342" width="14" height="12" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="788.0" y="352" font-size="11.5" fill="#1f2933">ML-KEM-768</text><rect x="690" y="364" width="14" height="12" rx="3" fill="#fff" stroke="#6b7280" stroke-width="1.6"/><text x="710.0" y="374" font-size="11.5" fill="#1f2933">outlined: sent encrypted</text><text x="32.0" y="438" font-size="12" fill="#1f2933">The session key is secret if either X25519 or ML-KEM-768 is unbroken. Authentication stays classical.</text><text x="32.0" y="457" font-size="11.5" fill="#6b7280">2,480 B on the wire, 2,288 B more than classical XX (192 B). Chip widths are to scale; circles are DH operations, which add no bytes.</text></svg>
